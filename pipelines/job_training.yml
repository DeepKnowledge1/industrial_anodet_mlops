$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

description: Train a PaDiM anomaly detection model on images
display_name: Train PaDiM Model
experiment_name: padim_anomaly_detection_experiment

code: ../src
command: >
  python train.py
  --dataset_path ${{inputs.dataset_path}}
  --test_dataset_path ${{inputs.test_dataset_path}}

environment: azureml:mlops_anomavision_env:3

# environment:
#   docker:
#     build:
#       path: .
#       dockerfile_path: Dockerfile


inputs:
  dataset_path:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/fa1869bfbda583ff5928f0e99c041ecc/bottle  # ← from DATASET_NAME

  test_dataset_path:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/fa1869bfbda583ff5928f0e99c041ecc/bottle  # ← reuse or create test dataset separately

outputs:
  model_output:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/models/anomavision/

compute: azureml:compute-anomavision  # ← from COMPUTE_NAME
