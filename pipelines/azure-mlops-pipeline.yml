trigger:
  - main

pool:
  name: Default

variables:
  - group: mlops-azure-components
jobs:
  - job: BuildAndTest
    displayName: 'Build and Test'
    pool:
      name: Default
    steps:
      # 1. Set up the desired Python version FIRST.
      # This ensures all following steps use Python 3.11.
      - task: UsePythonVersion@0
        displayName: 'Use Python 3.11.0'
        inputs:
          versionSpec: '3.11.0' # You can use '3.11.0' instead of '3.11.0'
          # addToPath: true

      # 2. Now, call your templates. The Python version is already active.
      - template: templates/install_dependencies.yml
      - template: templates/test.yml # This template should now have access to the installed packages.
