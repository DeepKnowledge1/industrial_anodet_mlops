trigger:
  - main

pool:
  name: Default

variables:
  - group: mlops-azure-components

stages:
  - stage: BuildAndTest
    displayName: 'Build and Test Stage'
    jobs:
      - job: BuildAndTestJob
        displayName: 'Build and Test'
        pool:
          name: Default
        steps:
          - checkout: self
            submodules: true
            persistCredentials: true
            fetchDepth: 0  # Ensures full history, which submodules sometimes need

          - script: |
              git submodule update --init --recursive
            displayName: 'Manually update submodules'

          - task: UsePythonVersion@0
            displayName: 'Use Python 3.11.0'
            inputs:
              versionSpec: '3.11.0'

          - template: templates/install_dependencies.yml
          - template: templates/test.yml
