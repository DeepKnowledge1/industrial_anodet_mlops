steps:
  - script: |
      echo "##vso[task.setvariable variable=PYTHONPATH]$(Build.SourcesDirectory)\src"
    displayName: 'Set PYTHONPATH for Windows'

  - script: |
      echo "--- Current Directory ---"
      cd
      echo "--- Python Version ---"
      python --version
      echo "--- Pip Version ---"
      python -m pip --version
      echo "--- Installed Packages ---"
      python -m pip list
    displayName: 'Debug: Check Environment (Windows)'
    workingDirectory: $(Build.SourcesDirectory)

  - script: |
      echo "Running tests..."
      python -m pytest tests/test_anomavision.py -v --doctest-modules --junitxml=junit/test-results.xml
    displayName: 'Run pytest'
    workingDirectory: $(Build.SourcesDirectory)

  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFiles: '**/test-results.xml'
    condition: succeededOrFailed()
