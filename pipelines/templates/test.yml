steps:
  - script: |
      if not exist junit mkdir junit
      echo Running tests...
      pytest tests -v --doctest-modules --junitxml=junit/test-results.xml
      echo Pytest finished with exit code %ERRORLEVEL%
    displayName: 'Run pytest'
    continueOnError: true  # Critical to avoid stopping the pipeline

  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFiles: '**/test-results.xml'
    condition: succeededOrFailed()
