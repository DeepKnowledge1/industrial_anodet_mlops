steps:
  # Set PYTHONPATH for the subsequent tasks in the job
  - script: |
      echo "##vso[task.setvariable variable=PYTHONPATH]$(Build.SourcesDirectory)\src"
    displayName: 'Set PYTHONPATH for Windows'

  # Debugging step with Windows commands
  - script: |
      echo "--- Current Directory ---"
      cd
      echo "--- Listing Root Directory ---"
      dir /s
      echo "--- Python Path ---"
      echo %PYTHONPATH%
      echo "--- Installed Packages ---"
      pip list
    displayName: 'Debug: Check Environment (Windows)'
    workingDirectory: $(Build.SourcesDirectory)

  # Run pytest using the python interpreter
  - script: |
      echo "Running tests..."
      python -m pytest tests/test_anomavision.py -v --doctest-modules --junitxml=junit/test-results.xml
    displayName: 'Run pytest'
    workingDirectory: $(Build.SourcesDirectory)
    continueOnError: false

  # Publish test results
  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFiles: '**/test-results.xml'
    condition: succeededOrFailed()
