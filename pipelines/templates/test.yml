steps:
  - script: |
      echo "Checking Poetry installation..."
      poetry --version
      echo "Checking Python version..."
      python --version
      echo "Checking installed packages..."
      poetry show
      echo "Checking pytest specifically..."
      poetry run python -c "import pytest; print(f'pytest version: {pytest.__version__}')"
    displayName: 'Debug: Check installations'

  - script: |
      if not exist junit mkdir junit
      poetry run pytest tests --doctest-modules --junitxml=junit/test-results.xml
    displayName: 'Run pytest'

  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFiles: '**/test-results.xml'
    condition: succeededOrFailed()