steps:
  - script: |
      echo "##vso[task.setvariable variable=PYTHONPATH;]$(Build.SourcesDirectory)/src"
    displayName: 'Set PYTHONPATH'

  - script: |
      echo "--- Current Directory ---"
      pwd
      echo "--- Listing Root Directory ---"
      ls -R .
      echo "--- Python Path ---"
      echo $PYTHONPATH
      echo "--- Installed Packages ---"
      pip list
    displayName: 'Debug: Check Environment'
    workingDirectory: $(Build.SourcesDirectory)

  - script: |
      echo "Running tests..."
      python -m pytest tests/test_anomavision.py -v --doctest-modules --junitxml=junit/test-results.xml
    displayName: 'Run pytest'
    workingDirectory: $(Build.SourcesDirectory)
    continueOnError: false

  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFiles: '**/test-results.xml'
    condition: succeededOrFailed()
