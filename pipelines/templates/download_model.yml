jobs:
- job: DownloadModel
  displayName: "Download ONNX Model from Azure ML"
  steps:
    - task: AzureCLI@2
      displayName: "Download Model via Azure CLI"
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          # Define download path
          $downloadPath = "./models"

          # Create directory if not exists
          New-Item -ItemType Directory -Force -Path $downloadPath

          # Download the model to the specified path
          az ml model download `
            --name "anomavision_model" `
            --version 1 `
            --resource-group $(RESOURCE_GROUP) `
            --workspace-name $(WORKSPACE) `
            --download-path $downloadPath

          Write-Host "Model downloaded to: $downloadPath"            
          # After download
          $sourceFile = "$downloadPath/model_output/padim_model.onnx"
          $destFile = "./padim_model.onnx"

          if (Test-Path $sourceFile) {
              Copy-Item -Path $sourceFile -Destination $destFile -Force
              Write-Host "Moved padim_model.onnx to root directory."
          } else {
              Write-Error "ONNX model file not found at expected location."
          }          