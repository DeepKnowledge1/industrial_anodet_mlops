parameters: {}
jobs:
- job: BuildDockerImage
  displayName: "Build Docker Image (FastAPI + NumPy)"
  steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        artifactName: 'models'
        downloadPath: '.'
    - task: Docker@2
      displayName: "Build FastAPI Docker Image with NumPy"
      inputs:
        command: build
        Dockerfile: docker/Dockerfile.np
        buildContext: .
        tags: |
          fastapi-$(DOCKER_IMAGE_NAME):np
        arguments: --no-cache
