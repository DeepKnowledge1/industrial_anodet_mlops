parameters: {}
jobs:
- job: BuildDockerImage
  displayName: "Build Docker Image (FastAPI + NumPy)"
  steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        artifactName: 'models'
        downloadPath: './'  
    - task: Docker@2
      displayName: "Build FastAPI Docker Image with NumPy"
      inputs:
        command: build
        repository: 'fastapi-anomavision'  
        Dockerfile: docker/Dockerfile.np
        buildContext: .
        tags: |
          np
        arguments: --no-cache
