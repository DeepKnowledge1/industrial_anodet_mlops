steps:
  - script: |
      echo "--- Upgrading Pip ---"
      "$(Python.Interpreter)" -m pip install --upgrade pip

      echo "--- Installing packages from requirements.txt ---"
      "$(Python.Interpreter)" -m pip install -r requirements.txt

      echo "--- Installing pytest ---"
      "$(Python.Interpreter)" -m pip install pytest pytest-azurepipelines
    displayName: 'Install Dependencies and Pytest'
    workingDirectory: $(Build.SourcesDirectory)/requirements
