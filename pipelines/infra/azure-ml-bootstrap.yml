
trigger:
  paths:
    include:
      - infra/

pool:
  name: Default

variables:
  - group: mlops-azure-components

stages:
- stage: BootstrapAzureMLInfra
  displayName: 'Provision Azure ML Infrastructure'
  jobs:
  - job: Setup
    displayName: 'Create ACR, AKS, Workspace, Compute, Dataset'
    steps:

    - task: AzureCLI@2
      displayName: 'Step 1 - Create Resource Group'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az group create `
            --name $(RESOURCE_GROUP) `
            --location $(LOCATION)

    - task: AzureCLI@2
      displayName: 'Step 2 - Create Azure ML Workspace (if not exists)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = "Continue"
          try {
            az ml workspace show `
              --name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP) `
              --output none
            $exists = $true
          } catch {
            $exists = $false
          }
          if (-not $exists) {
            az ml workspace create `
              --name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP) `
              --location $(LOCATION)
          }

    - task: AzureCLI@2
      displayName: 'Step 3 - Create Azure Container Registry (ACR)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = "Continue"
          try {
            az acr show --name $(ACR_NAME) --resource-group $(RESOURCE_GROUP) --output none
            $exists = $true
          } catch {
            $exists = $false
          }
          if (-not $exists) {
            az acr create `
              --name $(ACR_NAME) `
              --resource-group $(RESOURCE_GROUP) `
              --sku Basic `
              --location $(LOCATION)
          }

    - task: AzureCLI@2
      displayName: 'Step 4 - Create AKS Cluster (if not exists)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = "Continue"
          try {
            az aks show --name $(AKS_NAME) --resource-group $(RESOURCE_GROUP) --output none
            $exists = $true
          } catch {
            $exists = $false
          }
          if (-not $exists) {
            az aks create `
              --name $(AKS_NAME) `
              --resource-group $(RESOURCE_GROUP) `
              --node-count 1 `
              --enable-managed-identity `
              --generate-ssh-keys
          }

    - task: AzureCLI@2
      displayName: 'Step 5 - Create Azure ML Compute Cluster'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = "Continue"
          try {
            az ml compute show `
              --name $(COMPUTE_NAME) `
              --workspace-name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP) `
              --output none
            $exists = $true
          } catch {
            $exists = $false
          }
          if (-not $exists) {
            az ml compute create `
              --name $(COMPUTE_NAME) `
              --size Standard_DS2_v2 `
              --type amlcompute `
              --min-instances 0 `
              --max-instances 2 `
              --workspace-name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP)
          }

    - task: AzureCLI@2
      displayName: 'Step 6 - Register Azure ML Datastore (optional)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = "Continue"
          try {
            az ml datastore show `
              --name $(DATASTORE_NAME) `
              --workspace-name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP) `
              --output none
            $exists = $true
          } catch {
            $exists = $false
          }
          if (-not $exists) {
            az ml datastore register-azure-blob `
              --name $(DATASTORE_NAME) `
              --workspace-name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP) `
              --account-name "<your-storage-account-name>" `
              --container-name "<your-container-name>" `
              --credential account_key
          }
