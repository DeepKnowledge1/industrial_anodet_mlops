trigger:
  paths:
    include:
      - infra/

pool:
  name: Default  # or use 'vmImage: "windows-latest"' if you're using a Microsoft-hosted agent

variables:
  - group: mlops-azure-components  # Azure Key Vault or variable group
  # Make sure the following variables are defined in your group or pipeline
  # RESOURCE_GROUP, LOCATION, WORKSPACE, ACR_NAME, AKS_NAME, COMPUTE_NAME, DATASTORE_NAME

stages:
- stage: BootstrapAzureMLInfra
  displayName: 'Provision Azure ML Infrastructure'
  jobs:
  - job: Setup
    displayName: 'Create ACR, AKS, Workspace, Compute, Dataset'
    steps:

    - task: AzureCLI@2
      displayName: 'Step 1 - Create Resource Group'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az group create `
            --name $(RESOURCE_GROUP) `
            --location $(LOCATION)

    - task: AzureCLI@2
      displayName: 'Step 2 - Create Azure ML Workspace (if not exists)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml workspace show `
            --name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP) `
            --only-show-errors `
            --output none 2>$null

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating Azure ML Workspace..."
            az ml workspace create `
              --name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP) `
              --location $(LOCATION)
          } else {
            Write-Host "Azure ML Workspace already exists."
          }

    - task: AzureCLI@2
      displayName: 'Step 3 - Create Azure Container Registry (ACR)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az acr show --name $(ACR_NAME) --resource-group $(RESOURCE_GROUP) --output none 2>$null
          if ($LASTEXITCODE -ne 0) {
            az acr create `
              --name $(ACR_NAME) `
              --resource-group $(RESOURCE_GROUP) `
              --sku Basic `
              --location $(LOCATION)
          } else {
            Write-Host "ACR already exists."
          }

    - task: AzureCLI@2
      displayName: 'Step 4 - Create AKS Cluster (for inference)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az aks show --name $(AKS_NAME) --resource-group $(RESOURCE_GROUP) --output none 2>$null
          if ($LASTEXITCODE -ne 0) {
            az aks create `
              --name $(AKS_NAME) `
              --resource-group $(RESOURCE_GROUP) `
              --node-count 1 `
              --enable-managed-identity `
              --generate-ssh-keys
          } else {
            Write-Host "AKS already exists."
          }

    - task: AzureCLI@2
      displayName: 'Step 5 - Create Azure ML Compute Cluster'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml compute show `
            --name $(COMPUTE_NAME) `
            --workspace-name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP) `
            --output none 2>$null

          if ($LASTEXITCODE -ne 0) {
            az ml compute create `
              --name $(COMPUTE_NAME) `
              --size Standard_DS2_v2 `
              --type amlcompute `
              --min-instances 0 `
              --max-instances 2 `
              --workspace-name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP)
          } else {
            Write-Host "Compute cluster already exists."
          }

    - task: AzureCLI@2
      displayName: 'Step 6 - Register Azure ML Datastore (optional)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $datastore = az ml datastore show `
            --name $(DATASTORE_NAME) `
            --workspace-name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP) `
            --only-show-errors `
            --output none 2>$null

          if ($LASTEXITCODE -ne 0) {
            az ml datastore register-azure-blob `
              --name $(DATASTORE_NAME) `
              --workspace-name $(WORKSPACE) `
              --resource-group $(RESOURCE_GROUP) `
              --account-name "<your-storage-account-name>" `
              --container-name "<your-container-name>" `
              --credential "account_key"
          } else {
            Write-Host "Datastore already exists."
          }
