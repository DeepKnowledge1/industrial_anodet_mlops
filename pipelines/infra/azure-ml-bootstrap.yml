
trigger:
  paths:
    include:
      - infra/

pool:
  name: Default

variables:
  - group: mlops-azure-components

stages:
- stage: BootstrapAzureMLInfra
  displayName: 'Provision Azure ML Infrastructure'
  jobs:
  - job: Setup
    displayName: 'Create ACR, AKS, Workspace, Compute, Dataset'
    steps:

    - task: AzureCLI@2
      displayName: 'Step 1 - Create Resource Group'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az group create `
            --name $(RESOURCE_GROUP) `
            --location $(LOCATION)

    - task: AzureCLI@2
      displayName: 'Step 2 - Create Azure ML Workspace'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml workspace create `
            --name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP) `
            --location $(LOCATION)

    - task: AzureCLI@2
      displayName: 'Step 3 - Create Azure Container Registry (ACR)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az acr create `
            --name $(ACR_NAME) `
            --resource-group $(RESOURCE_GROUP) `
            --sku Basic `
            --location $(LOCATION)

    - task: AzureCLI@2
      displayName: 'Step 4 - Create AKS Cluster'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az aks create `
            --name $(AKS_NAME) `
            --resource-group $(RESOURCE_GROUP) `
            --node-count 1 `
            --enable-managed-identity `
            --generate-ssh-keys

    - task: AzureCLI@2
      displayName: 'Step 5 - Create Azure ML Compute Cluster'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml compute create `
            --name $(COMPUTE_NAME) `
            --size Standard_DS2_v2 `
            --type amlcompute `
            --min-instances 0 `
            --max-instances 2 `
            --workspace-name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP)

    - task: AzureCLI@2
      displayName: 'Step 6 - Upload Training Images to ML Dataset'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml data create `
            --name anomaly-images `
            --type uri_folder `
            --path ./bottle/train/good `
            --description "Training images for anomaly detection" `
            --workspace-name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP)
