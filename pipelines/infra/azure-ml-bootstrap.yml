    - task: AzureCLI@2
      displayName: 'Step 5 - Create k8s-extension'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |

          # Fetch secrets from Key Vault
          $SSL_CERT = az keyvault secret show --name ssl-cert-pem --vault-name keyvault-test2248 --query value -o tsv
          $SSL_KEY = az keyvault secret show --name ssl-key-pem --vault-name keyvault-test2248 --query value -o tsv

          # Write to PEM files
          $SSL_CERT | Out-File -FilePath "./ssl_cert.pem" -Encoding ascii
          $SSL_KEY | Out-File -FilePath "./ssl_key.pem" -Encoding ascii

          # Step 6: Deploy Azure ML extension on AKS
          Write-Host "************************************Deploying Azure ML extension on AKS..."

          az k8s-extension create `
            --name azureml `
            --extension-type Microsoft.AzureML.Kubernetes `
            --cluster-type managedClusters `
            --cluster-name $(AKS_NAME) `
            --resource-group $(RESOURCE_GROUP) `
            --configuration-settings enableTraining=True enableInference=True inferenceRouterServiceType=loadBalancer sslCname=your.domain.com `
            --config-protected-settings sslCertPemFile=./ssl_cert.pem sslKeyPemFile=./ssl_key.pem

    - task: AzureCLI@2
      displayName: 'Step 6 - Attach AKS to Azure ML Workspace'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |

          az ml compute attach `
            --resource-group $(RESOURCE_GROUP) `
            --workspace-name $(WORKSPACE) `
            --type Kubernetes `
            --name $(ML_AKS_NAME) `
            --resource-id $(az aks show --name $(AKS_NAME) --resource-group $(RESOURCE_GROUP) --query id -o tsv) `
            --identity-type SystemAssigned `
            --namespace azureml


    - task: AzureCLI@2
      displayName: 'Step 7 - Create Azure ML Compute Cluster'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml compute create `
            --name $(COMPUTE_NAME) `
            --type AmlCompute `
            --size Standard_DS2_v2 `
            --min-instances 0 `
            --max-instances 1 `
            --idle-time-before-scale-down 120 `
            --resource-group $(RESOURCE_GROUP) `
            --workspace-name $(WORKSPACE)

    - task: AzureCLI@2
      displayName: 'Step 8 - Upload Training Images to ML Dataset'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $path = "$(DATA_ANO_DIR)"
          Write-Host "Uploading from: $path"
          az ml data create `
            --name anomaly-images `
            --type uri_folder `
            --path $path `
            --description "Training + test + ground truth images for anomaly detection" `
            --workspace-name "$(WORKSPACE)" `
            --resource-group "$(RESOURCE_GROUP)"


    - task: AzureCLI@2
      displayName: 'Step 9 - Register Training Environment'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |

          az ml environment create `
            --name mlops_anomavision `
            --image mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest `
            --conda-file "$(Build.SourcesDirectory)/deployment/environment.yml" `
            --workspace-name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP)
          
