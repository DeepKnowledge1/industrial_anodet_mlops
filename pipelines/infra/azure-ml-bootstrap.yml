
trigger:
  paths:
    include:
      - infra/

pool:
  name: Default

variables:
  - group: mlops-azure-components

stages:
- stage: BootstrapAzureMLInfra
  displayName: 'Provision Azure ML Infrastructure'
  jobs:
  - job: Setup
    displayName: 'Create ACR, AKS, Workspace, Compute, Dataset'
    steps:

    # - task: AzureCLI@2
    #   displayName: 'Step 1 - Create Resource Group'
    #   inputs:
    #     azureSubscription: mlops_anomaly_detection
    #     scriptType: ps
    #     scriptLocation: inlineScript
    #     inlineScript: |
    #       az group create `
    #         --name $(RESOURCE_GROUP) `
    #         --location $(LOCATION)

    # - task: AzureCLI@2
    #   displayName: 'Step 2 - Create Azure ML Workspace'
    #   inputs:
    #     azureSubscription: mlops_anomaly_detection
    #     scriptType: ps
    #     scriptLocation: inlineScript
    #     inlineScript: |
    #       az ml workspace create `
    #         --name $(WORKSPACE) `
    #         --resource-group $(RESOURCE_GROUP) `
    #         --location $(LOCATION)

    - task: AzureCLI@2
      displayName: 'Step 3 - Create Azure Container Registry (ACR)'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |

          az acr create `
              --resource-group $(RESOURCE_GROUP) `
              --name $(ACR_NAME) `
              --sku Basic `
              --location $(LOCATION) `
              --admin-enabled false `




    - task: AzureCLI@2
      displayName: 'Step 4 - Create AKS Cluster'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |

          az aks create `
            --resource-group $RESOURCE_GROUP `
            --name $AKS_NAME `
            --enable-cluster-autoscaler `
            --min-count 0 `
            --max-count 2 `
            --node-count 0 `
            --node-vm-size Standard_DS3_v2 `
            --enable-managed-identity `
            --generate-ssh-keys `
            --enable-addons monitoring `
            --load-balancer-idle-timeout 4 `
            --no-ssh-key

    - task: AzureCLI@2
      displayName: 'Step 5 - Create Azure ML Compute Cluster'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml compute create `
            --name $(COMPUTE_NAME) `
            --type AmlCompute `
            --size Standard_DS2_v2 `
            --min-instances 0 `
            --max-instances 1 `
            --idle-seconds-before-scaledown 20 `
            --resource-group $(RESOURCE_GROUP) `
            --workspace-name $(WORKSPACE)

    - task: AzureCLI@2
      displayName: 'Step 6 - Attach AKS to Azure ML Workspace'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |

          az ml compute attach `
            --resource-group $(RESOURCE_GROUP) `
            --workspace-name $(WORKSPACE_NAME) `
            --type Kubernetes `
            --name $(ML_AKS_NAME) `
            --resource-id $(az aks show --name $AKS_NAME --resource-group $RESOURCE_GROUP --query id -o tsv) `
            --identity-type SystemAssigned `
            --namespace azureml


    - task: AzureCLI@2
      displayName: 'Step 7 - Upload Training Images to ML Dataset'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml data create `
            --name anomaly-images `
            --type uri_folder `
            --path $env:DATA_ANO_DIR `
            --description "Training + test + ground truth images for anomaly detection" `
            --workspace-name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP)


    - task: AzureCLI@2
      displayName: 'Step 8 - Register Training Environment'
      inputs:
        azureSubscription: mlops_anomaly_detection
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az ml environment create `
            --file "$(Build.SourcesDirectory)/deployment/environment.yml" `
            --workspace-name $(WORKSPACE) `
            --resource-group $(RESOURCE_GROUP)
